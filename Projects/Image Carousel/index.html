<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Image Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="carousel">
        <div class="imgcontainer">
            <img id="carouselImg" alt="Image">
        </div>
        <button id="prevBtn" onclick="previousImg()">Previous</button>
        <button id="nextBtn" onclick="nextImg()">Next</button>
    </div>
    <script src="./index.js"></script>
</body>

</html>
